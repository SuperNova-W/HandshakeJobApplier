spring.application.name=handshook-backend
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${SERVER_PORT:8765}

app.version=0.1.0
google.oauth.client-id=${GOOGLE_OAUTH_CLIENT_ID:}
app.cors.allowed-origin=${ALLOWED_EXTENSION_ORIGIN:chrome-extension://*}

# ─── Persistence (local SQLite file) ──────────────────────────────────────────
# HANDSHOOK_DB_PATH overrides the on-disk location; defaults to data/handshook.db
# relative to the working directory. The schema below is created automatically on
# first start via schema.sql (CREATE TABLE IF NOT EXISTS, idempotent).
spring.datasource.url=jdbc:sqlite:${HANDSHOOK_DB_PATH:data/handshook.db}
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.sql.init.mode=always
# SQLite serialises writes; a small pool plus a busy timeout avoids SQLITE_BUSY.
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.connection-init-sql=PRAGMA busy_timeout=5000

auth.token.secret=${AUTH_TOKEN_SECRET:}
auth.token.ttl-seconds=${AUTH_TOKEN_TTL_SECONDS:2592000}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# Document uploads (resume / cover letter / transcript / etc.).
spring.servlet.multipart.max-file-size=4MB
spring.servlet.multipart.max-request-size=5MB

# ─── Logging / debugging ──────────────────────────────────────────────────────
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [%logger{0}] %msg%n

# Verbose for our own code + the HTTP request log; keep frameworks at INFO.
logging.level.com.handshook=DEBUG
logging.level.com.handshook.http=INFO
spring.mvc.log-resolved-exception=true
