spring.application.name=handshook-backend
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${SERVER_PORT:8765}

app.version=0.1.0
google.oauth.client-id=${GOOGLE_OAUTH_CLIENT_ID:}
app.cors.allowed-origin=${ALLOWED_EXTENSION_ORIGIN:chrome-extension://*}

# The backend stores no user data: profile, screening preferences, and run
# history live in the extension's chrome.storage.local. Only the stateless AI
# endpoints (cover letter / other docs / PDF render) and Google sign-in remain.

auth.token.secret=${AUTH_TOKEN_SECRET:}
auth.token.ttl-seconds=${AUTH_TOKEN_TTL_SECONDS:2592000}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# Per-user hourly cap on OpenAI-backed generation endpoints (cost protection on
# the public deployment). Counted in-process; see AiRateLimitInterceptor.
app.ai.hourly-limit=${AI_HOURLY_LIMIT:30}

# Document uploads (resume / cover letter / transcript / etc.).
spring.servlet.multipart.max-file-size=4MB
spring.servlet.multipart.max-request-size=5MB

# ─── Logging / debugging ──────────────────────────────────────────────────────
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [%logger{0}] %msg%n

# Verbose for our own code + the HTTP request log; keep frameworks at INFO.
logging.level.com.handshook=DEBUG
logging.level.com.handshook.http=INFO
spring.mvc.log-resolved-exception=true
