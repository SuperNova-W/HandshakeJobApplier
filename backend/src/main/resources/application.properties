spring.application.name=handshake-auto-apply-backend
server.address=127.0.0.1
server.port=8765

app.version=0.1.0

spring.datasource.url=jdbc:sqlite:./data/handshake-auto-apply.db?busy_timeout=5000&foreign_keys=on
spring.datasource.driver-class-name=org.sqlite.JDBC

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# Document uploads (resume / cover letter / transcript / etc.)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# ─── Logging / debugging ──────────────────────────────────────────────────────
# Console + rolling file. Tail with: tail -f backend/logs/backend.log
logging.file.name=./logs/backend.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=7
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [%logger{0}] %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n

# Verbose for our own code + the HTTP request log; keep frameworks at INFO.
logging.level.com.handshakeautoapply=DEBUG
logging.level.com.handshakeautoapply.http=INFO
spring.mvc.log-resolved-exception=true
